# Two adjustments to the stock Supabase self-hosted stack.
#
# 1. Unused services go behind a profile, which keeps them out of a plain
#    `docker compose up`. The app talks to PostgREST (rest), Storage, GoTrue
#    (auth, for password reset) and Studio only, and nothing in the compose
#    file depends_on the three below. On a modest office PC that is roughly
#    500 MB of RAM back.
#    Need one anyway?  docker compose --profile extras up -d
#
# 2. Every service is renamed with a `vat-erp-` prefix. The stock file pins
#    container_name to `supabase-*`, which is global to the Docker daemon —
#    a second Supabase stack on the same machine (a dev copy, another product)
#    fails to start with a name conflict, no matter what COMPOSE_PROJECT_NAME
#    says.
services:
  realtime:
    profiles: ["extras"]
    container_name: vat-erp-realtime
  supavisor:
    profiles: ["extras"]
    container_name: vat-erp-pooler
  functions:
    profiles: ["extras"]
    container_name: vat-erp-functions

  # 4. Studio gets longer to become healthy, and Kong no longer waits for it.
  #
  # The stock file gives Studio ~35s (start_period 20s + 3 retries) to answer
  # its healthcheck, and makes Kong depend on `service_healthy`. Studio is a
  # Next.js app: on a laptop that is also booting Postgres, PostgREST, GoTrue
  # and Storage, it routinely needs longer than that on the first start —
  # measured here, it came up healthy only after the deadline had passed, and
  # the whole install aborted with "container vat-erp-studio is unhealthy".
  #
  # Kong does not need Studio for anything; it only routes to it. Waiting for
  # it to be *started* keeps the ordering without letting a slow admin panel
  # take the entire system down.
  studio:
    container_name: vat-erp-studio
    healthcheck:
      start_period: 180s
      retries: 20

  # 3. Kong is bound to the loopback instead of every interface.
  #
  # Kong is the front door to the database API AND to Supabase Studio, and the
  # stock file publishes it on 0.0.0.0 — reachable from the whole network,
  # behind nothing but Studio's basic-auth password and Postgres RLS. Nothing
  # off-machine needs it: the Next.js server talks to it over localhost, and
  # an admin who needs Studio from elsewhere should tunnel in (ssh -L) rather
  # than leave the panel listening on the LAN.
  #
  # `!override` replaces the stock ports list instead of appending to it.
  kong:
    container_name: vat-erp-kong
    depends_on: !override
      studio:
        condition: service_started
    ports: !override
      - 127.0.0.1:${KONG_HTTP_PORT}:8000/tcp
      - 127.0.0.1:${KONG_HTTPS_PORT}:8443/tcp
  auth:
    container_name: vat-erp-auth
  rest:
    container_name: vat-erp-rest
  storage:
    container_name: vat-erp-storage
  imgproxy:
    container_name: vat-erp-imgproxy
  meta:
    container_name: vat-erp-meta
  db:
    container_name: vat-erp-db
